# Dataset configuration for YOLOv11 malaria detection (Condition A and B)
# Format: Ultralytics dataset YAML https://docs.ultralytics.com/datasets/detect/

# Root path; relative to project root (Ultralytics). Output from convert_to_yolo.py.
# NIH polygon annotations: https://lhncbc.nlm.nih.gov/LHC-downloads/downloads.html#malaria-datasets
path: data/processed

# Train/val/test; required keys (Ultralytics). Patient-level 70/15/15 from create_splits.py.
# Split avoids leakage (scikit-learn convention): https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.train_test_split.html
train: images/train
val: images/val
test: images/test

# Class names: parasitized (infected RBC) and uninfected RBC
names:
  0: parasitized
  1: uninfected

# nc must match len(names)
nc: 2
