# Dataset config for Condition C and D: oversampled train list
# Parasitized images appear 3x in train list; val/test unchanged

# Root path; same as dataset.yaml
# NIH malaria: https://lhncbc.nlm.nih.gov/LHC-downloads/downloads.html#malaria-datasets
path: data/processed

# train: .txt file with one image path per line
# train_oversampled.txt: parasitized images repeated 3x; build_oversampled_train_list.py
# Val/test: unchanged from dataset.yaml (patient-level splits)
train: train_oversampled.txt
val: images/val
test: images/test

names:
  0: parasitized
  1: uninfected

nc: 2
